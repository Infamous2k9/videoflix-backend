<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your email</title>
    <style>
        @media only screen and (max-width: 600px) {
            .content { padding: 24px 16px !important; }
            .button { display: block !important; text-align: center !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="max-width: 600px; font-family: Arial, Helvetica, sans-serif; color: #333333; font-size: 16px; line-height: 1.5;">
                    <tr>
                        <td class="content" style="padding: 32px 24px;">
                            <p style="margin: 0 0 32px; text-align: center;">
                                <img src="cid:videoflix_logo" alt="Videoflix" width="251" style="max-width: 100%; height: auto;">
                            </p>
                            <p style="margin: 0;">Dear <span style="color: #2e3edf;">{{ email }}</span>,</p>
                            <p style="margin: 0 0 32px;">
                                Thank you for registering with <span style="color: #2e3edf;">Videoflix</span>.
                                To complete your registration and verify your email address, please click the link below:
                            </p>
                            <p style="margin: 0 0 32px;">
                                <a href="{{ activation_url }}" class="button"
                                   style="display: inline-block; padding: 14px 32px; background-color: #2e3edf; color: #ffffff; font-weight: bold; font-size: 18px; text-decoration: none; border-radius: 40px;">Activate account</a>
                            </p>
                            <p style="margin: 0 0 24px;">If you did not create an account with us, please disregard this email.</p>
                            <p style="margin: 0 0 24px;">Best regards,</p>
                            <p style="margin: 0;">Your Videoflix Team.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
